services:
  minecraft:
    image: eclipse-temurin:25-jre
    container_name: minecraft
    working_dir: /usr/app
    volumes:
      - ./server:/usr/app
    ports:
      - "25565:25565"
    stdin_open: true
    tty: true
    restart: "no"
    stop_grace_period: 60s
    command: java -Xms2G -Xmx4G -jar server.jar nogui
networks:
  default:
    driver: bridge
